name: nucleartension
description: A base builder, resource management, nuclear war, survival game
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  web: ^1.1.1
  flame: ^1.30.1
  get_it: ^8.2.0
  logger: ^2.6.1
  dafluta: ^5.5.1
  flutter_svg: ^2.2.0
  url_strategy: ^0.3.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  firebase_core: ^4.0.0
  firebase_database: ^12.0.0
  firebase_crashlytics: ^5.0.0

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  dalocale: ^2.6.0
  daassets: ^1.5.0
  daunused: ^1.7.4
  dapublock: ^1.1.0
  build_runner: ^2.6.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.10.0

  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/HellasCour-Regular.ttf

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/buildings/
    - assets/images/countries/
    - assets/images/military/
    - assets/images/research/
