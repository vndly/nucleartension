name: nucleartension
description: A base builder, resource management, survival game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  get_it: ^7.6.8
  logger: ^2.2.0
  dafluta: ^5.3.0
  url_strategy: ^0.2.0
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.5.0
  daassets: ^1.5.0
  daunused: ^1.6.1
  dapublock: ^1.1.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/HellasCour-Regular.ttf

  assets:
    - assets/images/
    - assets/images/buildings/
    - assets/images/missiles/
    - assets/images/research/
    - assets/images/units/