name: nucleartension
description: A base builder, resource management, nuclear war, survival game
publish_to: none
version: 0.0.1+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  get_it: ^7.7.0
  logger: ^2.2.0
  dafluta: ^5.3.0
  flutter_svg: ^2.0.10+1
  url_strategy: ^0.2.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter 

dev_dependencies:
  dalocale: ^2.5.0
  daassets: ^1.5.0
  daunused: ^1.6.1
  dapublock: ^1.1.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0

  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/HellasCour-Regular.ttf

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/buildings/
    - assets/images/countries/
    - assets/images/military/
    - assets/images/research/